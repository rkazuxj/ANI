<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Network Map · Aura Capital | ANI</title>
<link rel="icon" href="assets/logo_ani.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e11;--panel:#171b20;--panel2:#22282e;--line:#3b434a;--tx:#f1eee7;--mu:#b2b8ba;--cu:#efa267;--cu2:#ffb985;
--v10:#8b7cf6;--v20:#2bb38a;--v30:#4c9eeb;--v40:#e8a33d;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{position:fixed;inset:0}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:14px;background:var(--cu);color:#1a0e05;font-weight:600;font-size:17px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line);font-weight:500}
/* intro */
#intro{display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 28px) 24px calc(var(--sb) + 24px);
background:
linear-gradient(180deg,rgba(12,14,17,.2),var(--bg) 75%),
repeating-linear-gradient(30deg,transparent 0 38px,rgba(210,123,60,.07) 38px 39px),
repeating-linear-gradient(150deg,transparent 0 38px,rgba(210,123,60,.07) 38px 39px),var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;color:var(--mu)}
.brand b{color:var(--cu2);font-weight:600;letter-spacing:.08em;font-size:15px}
.brand i{width:26px;height:2px;background:var(--cu);display:inline-block;position:relative}
.brand i:after{content:'';position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--cu)}
h1{font-size:clamp(32px,9vw,46px);line-height:1.05;font-weight:600;letter-spacing:-.02em;margin:18px 0 14px}
h1 em{font-style:normal;color:var(--cu2)}
.lead{color:var(--mu);font-size:17px;line-height:1.5;max-width:30ch}
#term{background:rgba(20,23,28,.85);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;font-size:12.5px;line-height:1.75;min-height:150px;margin:18px 0}
#term .ln{opacity:0;transform:translateY(4px);animation:in .35s forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#term .k{color:var(--cu2)}#term .d{color:var(--mu)}#term .ok{color:#5fd39a}
@keyframes in{to{opacity:1;transform:none}}
#card{border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line);margin:16px 0;opacity:0;transform:perspective(800px) rotateX(55deg) translateY(30px);transition:all .8s cubic-bezier(.2,.9,.25,1.1)}
#card.on{opacity:1;transform:none}
#card .band{height:6px}
#card .bd{padding:16px 18px 18px}
#card .lbl{font-size:11px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
#card .host{font-size:26px;font-weight:500;margin:4px 0 12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv div span{display:block;font-size:11px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.kv div b{font-weight:500;font-size:14px}
/* map */
#map {
  display: grid;
  grid-template: "mast" auto "stage" minmax(0,1fr) / 100%;
  background: var(--bg);
}
.mast {
  grid-area: mast; display:flex; align-items:center; gap:18px;
  padding:calc(var(--st) + 10px) clamp(14px,2.6vw,40px) 10px;
  background:#111418; color:var(--tx); border-bottom:1px solid var(--line);
}
.mast .site-back img { display:block; width:64px; background:#ebece5; padding:3px; border-radius:3px; }
.mast .site-back { flex:none; }
.map-title { border-left:1px solid #42484b; padding-left:18px; }
.map-title .aura-logo { display:block; width:132px; height:auto; padding:3px 6px; border-radius:3px; background:#f4f1fa; }
.map-title small, .origin-label, .route-label { font:600 10px/1.5 'JetBrains Mono',monospace; letter-spacing:.09em; text-transform:uppercase; }
.map-title small { color:var(--cu2); }
.stage {
  grid-area:stage; position:relative; min-height:0; overflow:hidden;
  background-color:#0d1014;
  background-image:radial-gradient(circle,#293139 1px,transparent 1.25px);
  background-size:22px 22px;
}
#svg { width:100%;height:100%;touch-action:none;display:block; }
#hud { position:absolute; top:10px;right:12px;display:flex;gap:5px; }
.ib { width:44px;height:44px;display:grid;place-items:center;background:#1a2026;border:1px solid var(--line);border-radius:5px; }
.ib svg { width:21px;height:21px;stroke:var(--tx);fill:none;stroke-width:1.8; }
#me { margin-left:auto;display:flex;align-items:center;gap:10px;padding:5px 10px;background:#1a2026;color:var(--tx);border:1px solid var(--line);border-radius:4px;min-width:0;text-align:left; }
#me .dot { width:10px;height:10px;flex:none;border:1px solid #233e44; }
#me .origin-text { display:grid;min-width:0; }
#meTxt { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px; }
#packetPanel {
  position:absolute;z-index:2;right:10px;bottom:max(10px,var(--sb));
  max-width:calc(100% - 20px);max-height:calc(100% - 20px);
  display:flex;flex-direction:column;overflow:hidden;background:var(--panel);
  border:1px solid #4a5258;border-radius:9px;box-shadow:0 6px 22px #0007;
}
#sheet {
  width:310px;max-width:100%;min-height:0;max-height:min(38dvh,350px);
  padding:10px 12px;overflow:auto;overscroll-behavior:contain;border-top:1px solid var(--line);
}
.panel-bar { display:flex;align-items:center;flex:none; }
#panelToggle {
  flex:1;min-height:44px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:0 12px 0 4px;font-size:13px;font-weight:600;
}
#panelToggle svg { width:15px;height:15px;color:var(--cu2); }
#panelToggle[aria-expanded="false"] svg { transform:rotate(180deg); }
#panelGrip {
  width:44px;height:44px;display:grid;place-items:center;cursor:grab;
  touch-action:none;color:var(--mu);
}
#panelGrip:active { cursor:grabbing; }
#panelGrip::before {
  content:"";width:12px;height:16px;
  background:radial-gradient(circle,var(--mu) 1.3px,transparent 1.6px) 0 0 / 5px 5px;
}
.sh-t { font-size:21px;line-height:1.12;letter-spacing:-.045em;font-weight:600;margin-bottom:9px; }
.sh-s { color:var(--mu);font-size:14px;line-height:1.5;margin-bottom:16px; }
.dests { display:grid;border-top:1px solid var(--line); }
.dest { display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line); }
.dest:hover,.dest:focus-visible { background:var(--panel2); }
.dest .socket { width:10px;height:10px;border:1px solid #233e4480; }
.dest strong { display:block;font-size:17px;letter-spacing:-.025em; }
.dest .m { font-size:12px;color:var(--mu); }
.dest .arrow { font-size:22px;color:var(--cu2); }
.hop-readout {
  position:absolute; left:12px; top:12px; max-width:calc(100% - 124px);
  padding:7px 10px; background:#171b20f2; border-left:3px solid #efa267;
  color:#ffddb7; font:500 12px/1.45 'JetBrains Mono',monospace;
  pointer-events:none; overflow-wrap:anywhere;
}
.hop-readout:empty { display:none; }
.current-link { stroke:#ffd6a1; stroke-width:5; filter:drop-shadow(0 0 3px #eea364); }
.btn,.btn.ghost,.tag,.hdr div,.stats div { border-radius:4px; }
.btn.ghost { color:var(--tx); }
#sheet .ctl { position:sticky;bottom:0;padding-top:6px;background:var(--panel); }
#sheet .ctl .btn { padding-inline:6px; }
.tag.delivered { background:#1a352e;color:#a9eac2; }
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--mu);margin-bottom:8px}
.hdr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 12px}
.hdr div{background:var(--panel2);border-radius:10px;padding:7px 10px;min-width:0}
.hdr span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.hdr b{display:block;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr div.chg{animation:chg 1.1s}
@keyframes chg{0%{background:var(--cu);color:#1a0e05}100%{background:var(--panel2)}}
.ctl{display:flex;gap:8px}
.ctl .btn{height:44px;font-size:15px;flex:1}
.ctl.col{flex-direction:column}.ctl.col .btn{flex:none;height:50px}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 12px}
.prog i{display:block;height:100%;background:var(--cu);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:var(--panel2);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-weight:600}
.stats span{font-size:12px;color:var(--mu)}
.note{font-size:13px;color:var(--mu);line-height:1.5;border-left:2px solid var(--cu);padding-left:10px;margin:4px 0 14px}
.rows{margin:8px 0 14px;font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rows div span{color:var(--mu)}
.rows div b{font-weight:500;text-align:right}
/* svg anim */
.drop{animation:drop .75s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes drop{from{transform:translateY(-90px);opacity:0}}
.wire{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fd .8s ease both}@keyframes fd{from{opacity:0}}
.blink{animation:bl 1.4s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.bob{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
.myring{transform-box:fill-box;transform-origin:center;animation:myr 2s ease-out infinite}
@keyframes myr{from{transform:scale(.6);opacity:.9}to{transform:scale(2);opacity:0}}
.bc{stroke-dasharray:6 7;animation:bcm .5s linear infinite}@keyframes bcm{to{stroke-dashoffset:-13}}
.dev{cursor:pointer}
.dev.sel .face,.dev:hover .face{stroke:#f6d7b5;stroke-width:1.8}
#toast{position:absolute;left:50%;top:calc(var(--st) + 64px);transform:translate(-50%,-10px);background:var(--cu);color:#1a0e05;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.drop,.wire,.fade,.bob,.myring,.blink{animation:none!important;stroke-dashoffset:0}}

#intro { overflow-y: auto; gap: 16px; }
#intro > div { flex-shrink: 0; }
#intro .brand { flex-wrap: wrap; }
.site-back { color: var(--tx); text-decoration: none; }
#map :focus-visible, #intro :focus-visible { outline: 2px solid var(--cu2); outline-offset: 2px; }
#intro { background-color:var(--bg);align-items:center;justify-content:safe center; }
#intro > div { width:min(100%,540px); }
#intro .brand img { width:62px;display:block; }
#intro .brand a { background:#f6f4eb;padding:6px;border-radius:3px; }
@media (max-width:759px) {
  .mast { gap:10px;padding-inline:10px; }
  .mast .site-back img { width:48px; }
  .map-title .aura-logo { width:104px; }
  .map-title { padding-left:10px; }
  #me { gap:6px;padding:4px 7px; }
  #meTxt { max-width:24vw;font-size:11px; }
  .dests { grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px; }
  .dest { grid-template-columns:8px minmax(0,1fr);gap:6px;padding:8px 0; }
  .dest strong { font-size:14px; }
  .dest .m { font-size:10px; }
  .dest .arrow { display:none; }
  .sh-s { margin-bottom:8px; }
}
</style>
</head>
<body>

<section id="intro" class="scr">
  <div>
    <div class="brand"><a class="site-back" href="index.html#home" aria-label="Voltar ao site da ANI"><img src="assets/ani.webp" alt="ANI"></a><i></i> NETWORK MAP</div>
    <h1>Você acabou de entrar na rede da <em>Aura Capital.</em></h1>
    <p class="lead" id="lead">Seu celular vai virar um computador desta rede. Explore os equipamentos e acompanhe um pacote atravessando VLANs, roteadores e a WAN.</p>
    <div id="term" class="mono hide"></div>
    <div id="card"><div class="band" id="cband"></div><div class="bd">
      <div class="lbl">Seu dispositivo</div>
      <div class="host mono" id="chost"></div>
      <div class="kv" id="ckv"></div>
    </div></div>
  </div>
  <div>
    <button class="btn" id="bConnect" style="width:100%">Conectar à rede</button>
    <button class="btn hide" id="bEnter" style="width:100%">Explorar a rede →</button>
  </div>
</section>

<section id="map" class="scr hide">
  <header class="mast">
    <a class="site-back" href="index.html#home" aria-label="Voltar ao site da ANI"><img src="assets/ani.webp" alt="ANI"></a>
    <div class="map-title"><small lang="en">Network Map</small><img class="aura-logo" src="assets/auralogo.svg" width="184" height="50" alt="Aura Capital"></div>
    <button id="me" title="Ver meu dispositivo"><span class="dot" id="meDot"></span><span class="origin-text"><span class="origin-label">Meu dispositivo</span><span class="mono" id="meTxt"></span></span></button>
  </header>
  <div class="stage">
    <svg id="svg" aria-label="Topologia interativa da matriz e da filial" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hud">
    <button class="ib" id="bFind" aria-label="Centralizar em mim"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="ib" id="bFit" aria-label="Ver a rede inteira"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
    <div class="hop-readout" id="hopReadout"></div>
    <div id="toast" role="status"></div>
    <aside id="packetPanel" aria-label="Painel da simulação">
      <div class="panel-bar">
        <button id="panelGrip" type="button" aria-label="Mover painel com as setas" title="Arraste ou use as setas do teclado"></button>
        <button id="panelToggle" type="button" aria-controls="sheet" aria-expanded="false">
          <span id="panelToggleText">Mandar um pacote</span>
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 5 5 5-5"/></svg>
        </button>
      </div>
      <div id="sheet" hidden></div>
    </aside>
  </div>
</section>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NS='http://www.w3.org/2000/svg';
const COPPER='#d27b3c';

/* ---------- dados da rede (dossiê Grupo 6) ---------- */
const VL={
 10:{n:'Operações',c:'#8b7cf6',net:'10.6.0.0/26',gw:'10.6.0.1',mask:'255.255.255.192',lo:2,hi:62,site:'M',pre:'OPS'},
 20:{n:'Administrativo',c:'#2bb38a',net:'10.6.0.64/27',gw:'10.6.0.65',mask:'255.255.255.224',lo:66,hi:94,site:'M',pre:'ADM'},
 30:{n:'Servidores',c:'#4c9eeb',net:'10.6.0.128/28',gw:'10.6.0.129',mask:'255.255.255.240',lo:130,hi:142,site:'M',pre:'SRV'},
 40:{n:'Atendimento',c:'#e8a33d',net:'10.6.0.96/27',gw:'10.6.0.97',mask:'255.255.255.224',lo:98,hi:126,site:'F',pre:'ATD'}};
const SITE={M:'Matriz',F:'Filial'};
const rmac=()=>Array.from({length:6},(_,i)=>{let b=Math.floor(Math.random()*256);if(i===0)b=(b&0xfc)|0x02;return b.toString(16).padStart(2,'0').toUpperCase()}).join(':');

const D=[]; const byId={};
function add(o){D.push(o);byId[o.id]=o;return o}
add({id:'r1',kind:'router',site:'M',x:8.5,y:.9,w:1.6,d:1,h:.55,label:'R1',name:'Roteador da matriz',model:'TP-Link ER7206',sim:'Cisco 2911 no Packet Tracer',mac:'50:91:E3:6A:00:01',
 ifs:{10:'10.6.0.1',20:'10.6.0.65',30:'10.6.0.129',wan:'10.6.0.217'},price:'R$ 1.169,99'});
add({id:'sw1',kind:'switch',site:'M',x:4.2,y:.9,w:2.4,d:1,h:.4,label:'SW1',name:'Switch matriz 1',model:'TP-Link TL-SG3452 · 48 portas',sim:'Cisco 2960-24TT no Packet Tracer',price:'R$ 2.590,90',role:'Servidores e Administrativo. Trunk 802.1Q até o R1 e até o SW2.'});
add({id:'sw2',kind:'switch',site:'M',x:2.2,y:4.5,w:2.4,d:1,h:.4,label:'SW2',name:'Switch matriz 2',model:'TP-Link TL-SG3452 · 48 portas',sim:'Cisco 2960-24TT no Packet Tracer',price:'R$ 2.590,90',role:'Operações. Trunk 802.1Q até o SW1.'});
add({id:'srv',kind:'server',site:'M',vlan:30,x:1,y:1,w:1.2,d:1.2,h:2.5,label:'SRV',name:'Host de servidores',ip:'10.6.0.130',mac:'0C:C4:7A:30:01:30'});
add({id:'r2',kind:'router',site:'F',x:14,y:12,w:1.6,d:1,h:.55,label:'R2',name:'Roteador da filial',model:'TP-Link ER7206',sim:'Cisco 2911 no Packet Tracer',mac:'50:91:E3:6A:00:02',
 ifs:{40:'10.6.0.97',wan:'10.6.0.218'},price:'R$ 1.169,99'});
add({id:'sw3',kind:'switch',site:'F',x:14,y:14.4,w:2.4,d:1,h:.4,label:'SW3',name:'Switch da filial',model:'TP-Link TL-SG3452 · 48 portas',sim:'Cisco 2960-24TT no Packet Tracer',price:'R$ 2.590,90',role:'Atendimento (VLAN 40). Uplink até o R2.'});
const PCS=[];
function pcs(v,list,sw,ips){list.forEach((p,i)=>{const o=add({id:'pc'+v+'_'+i,kind:'pc',site:VL[v].site,vlan:v,x:p[0],y:p[1],w:.9,d:.9,h:.85,sw:sw,ip:'10.6.0.'+ips[i],mac:rmac()});o.name='PC '+VL[v].n;o.host=VL[v].pre+'-PC-'+ips[i];PCS.push(o)})}
pcs(10,[[.8,6.4],[2.4,6.4],[4,6.4],[.8,7.9],[2.4,7.9],[4,7.9]],'sw2',[11,12,13,14,15,16]);
pcs(20,[[7.6,5],[9.4,5],[7.6,6.8],[9.4,6.8]],'sw1',[70,71,72,73]);
pcs(40,[[14,16.4],[15.8,16.4],[14,17.9],[15.8,17.9]],'sw3',[100,101,102,103]);

const C2=o=>[o.x+o.w/2,o.y+o.d/2];
const L=[];
function link(a,b,type,pts){const l={a:byId[a],b:byId[b],type,pts};L.push(l);return l}
link('srv','sw1','access',[C2(byId.srv),[1.6,1.4],C2(byId.sw1)]);
link('sw1','r1','trunk',[C2(byId.sw1),C2(byId.r1)]);
link('sw1','sw2','trunk',[C2(byId.sw1),[5.4,5],C2(byId.sw2)]);
link('r2','sw3','access',[C2(byId.r2),[14.8,14.9],C2(byId.sw3)]);
PCS.forEach(p=>{const c=C2(p),lane=p.x+1.2;
 if(p.sw==='sw2'){const s=C2(byId.sw2);link('sw2',p.id,'access',[s,[lane,s[1]],[lane,c[1]],c])}
 else if(p.sw==='sw1'){const s=C2(byId.sw1);link('sw1',p.id,'access',[s,[6.2,s[1]],[6.2,3.3],[lane,3.3],[lane,c[1]],c])}
 else{const s=C2(byId.sw3);link('sw3',p.id,'access',[s,[lane,s[1]],[lane,c[1]],c])}});
const WAN={a:byId.r1,b:byId.r2,type:'wan'};L.push(WAN);

/* ---------- identidade ---------- */
let me=null;
function pickMe(prevId){
 let cand=PCS.filter(p=>p.id!==prevId);const p=cand[Math.floor(Math.random()*cand.length)];
 const v=VL[p.vlan];const used=PCS.map(q=>q.ip);let ip;
 do{ip='10.6.0.'+(v.lo+8+Math.floor(Math.random()*(v.hi-v.lo-8)))}while(used.includes(ip));
 p.ip=ip;p.mac=rmac();p.host=v.pre+'-PC-'+ip.split('.')[3];return p}

 fly(camFor((b.x0+b.x1)/2,(b.y0+b.y1)/2,s),1400);
 if (!event) return;
 await sleep(2300);if(mode!=='home'||running)return;focusDev(me,.42,1500);await sleep(1500);toast('Você é '+me.host);buzz([20,40,20])}

/* ---------- roteamento ---------- */
const siteRouter=s=>s==='M'?byId.r1:byId.r2;
function nbrs(n){const out=[];L.forEach(l=>{if(l.a===n)out.push([l.b,l]);else if(l.b===n)out.push([l.a,l])});return out}
function l2(a,b){const prev=new Map([[a,null]]);const q=[a];
 while(q.length){const n=q.shift();if(n===b)break;for(const[m,l]of nbrs(n)){if(prev.has(m))continue;if(m!==b&&m.kind!=='switch')continue;if(l.type==='wan'&&!(m===b))continue;prev.set(m,[n,l]);q.push(m)}}
 const hops=[];let c=b;while(prev.get(c)){const[n,l]=prev.get(c);hops.unshift({from:n,to:c,link:l});c=n}return hops}
function segments(src,dst){const s=[];const dv=dst.kind==='router'?null:dst.vlan;
 if(dst.kind==='router'){const r=siteRouter(src.site);s.push({from:src,to:r,v:src.vlan,hops:l2(src,r)});if(r!==dst)s.push({from:r,to:dst,v:'wan',hops:[{from:r,to:dst,link:WAN}]});return s}
 if(src.vlan===dv){s.push({from:src,to:dst,v:dv,hops:l2(src,dst)});return s}
 const ra=siteRouter(src.site),rb=siteRouter(dst.site);
 s.push({from:src,to:ra,v:src.vlan,hops:l2(src,ra)});
 if(ra!==rb)s.push({from:ra,to:rb,v:'wan',hops:[{from:ra,to:rb,link:WAN}]});
 s.push({from:rb,to:dst,v:dv,hops:l2(rb,dst)});return s}
const ipOf=(n,v)=>n.kind==='router'?(n.ifs[v]||n.ifs.wan):n.ip;
const macOf=n=>n.mac;

/* ---------- animação do pacote ---------- */
let paused=false,speed=1,ARP={},abort=false;
async function wait(ms){let t=0;while(t<ms){if(abort)throw 'abort';await sleep(50);if(!paused)t+=50*speed}}
let pkEls=null,trail=[];
function pkInit(){gPk.innerHTML='';trail=[];pkEls={tr:[...Array(7)].map((_,i)=>el('circle',{r:9-i,fill:COPPER,opacity:(.5-i*.065).toFixed(2)},gPk)),halo:el('circle',{r:20,fill:COPPER,opacity:.28},gPk),core:el('circle',{r:9,fill:'#ffe3c4',stroke:'#fff','stroke-width':2},gPk)}}
function pkAt(p){trail.unshift(p);trail.length=7;pkEls.halo.setAttribute('cx',p[0]);pkEls.halo.setAttribute('cy',p[1]);pkEls.core.setAttribute('cx',p[0]);pkEls.core.setAttribute('cy',p[1]);
 pkEls.tr.forEach((c,i)=>{const q=trail[i]||p;c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1])});
 if(following&&!touching){const t=camFor(p[0],p[1],cam.s);cam.x+=(t.x-cam.x)*.09;cam.y+=(t.y-cam.y)*.09;const ts=fitS()*.42;cam.s+=(ts-cam.s)*.04;apply()}}
function sampler(hop){const l=hop.link;
 if(l.type==='wan'){const fw=hop.from===l.a;return{len:9,at:t=>bez(wanPath,fw?t:1-t)}}
 let w=l.pts.map(p=>[p[0],p[1]]);if(hop.from!==l.a)w=w.slice().reverse();
 const seg=[];let tot=0;for(let i=1;i<w.length;i++){const d=Math.hypot(w[i][0]-w[i-1][0],w[i][1]-w[i-1][1]);seg.push(d);tot+=d}
 return{len:tot,at:t=>{let r=t*tot;for(let i=0;i<seg.length;i++){if(r<=seg[i]||i===seg.length-1){const k=seg[i]?Math.min(1,r/seg[i]):1;return P(w[i][0]+(w[i+1][0]-w[i][0])*k,w[i][1]+(w[i+1][1]-w[i][1])*k,.15)}r-=seg[i]}}}}
function move(hop){return new Promise((res,rej)=>{const s=sampler(hop);const dur=Math.max(700,s.len*330);let t=0,last=performance.now();
 (function f(now){if(abort){rej('abort');return}const dt=now-last;last=now;if(!paused)t+=dt*speed/dur;if(t>=1){pkAt(s.at(1));res();return}pkAt(s.at(t));requestAnimationFrame(f)})(last)})}
function ringAt(o,color){const c=P(o.x+o.w/2,o.y+o.d/2,0);const r=el('ellipse',{class:'ring',cx:c[0],cy:c[1],rx:34,ry:20,fill:'none',stroke:color,'stroke-width':3},gFx);setTimeout(()=>r.remove(),1400)}
function domain(seg){if(seg.v==='wan')return{nodes:[seg.to],links:[WAN]};const v=seg.v,site=VL[v].site;
 const nodes=D.filter(o=>o.site===site&&((o.kind==='pc'||o.kind==='server')?o.vlan===v:o.kind==='router'));
 const links=L.filter(l=>l.type!=='wan'&&l.a.site===site&&(l.type==='trunk'||[l.a,l.b].some(n=>(n.kind==='pc'||n.kind==='server')&&n.vlan===v)||[l.a,l.b].some(n=>n.kind==='router')));
 return{nodes,links}}
function glow(links,color,ms){const out=[];links.forEach(l=>{const p=l.type==='wan'?el('path',{d:WAN.el.getAttribute('d'),fill:'none',stroke:color,'stroke-width':5,class:'bc'},gFx):el('polyline',{points:pts(l.pts.map(p=>[p[0],p[1],.03])),fill:'none',stroke:color,'stroke-width':5,class:'bc','stroke-linejoin':'round'},gFx);out.push(p)});setTimeout(()=>out.forEach(p=>p.remove()),ms)}

let prevH=null;
function hdrHTML(h){const cells=[['MAC origem',h.sm],['MAC destino',h.dm],['802.1Q',h.tag],['TTL',h.ttl],['IP origem',h.si],['IP destino',h.di]];
 const html='<div class="hdr mono">'+cells.map(c=>'<div'+(prevH&&prevH[c[0]]!==String(c[1])?' class="chg"':'')+'><span>'+c[0]+'</span><b>'+c[1]+'</b></div>').join('')+'</div>';
 prevH={};cells.forEach(c=>prevH[c[0]]=String(c[1]));return html}
function traceUI(step,total,tag,title,txt,h){mode='trace';
 setSheet('<div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="margin:0">'+tag+'</span><span class="mono" style="font-size:12px;color:var(--mu)">'+step+'/'+total+'</span></div>'+
 '<div class="prog" style="margin-top:10px"><i style="width:'+(step/total*100)+'%"></i></div><div class="sh-t">'+title+'</div><div class="sh-s" style="margin-bottom:0">'+txt+'</div>'+(h?hdrHTML(h):'<div style="height:12px"></div>')+
 '<div class="ctl"><button class="btn ghost" id="bP">'+(paused?'Continuar':'Pausar')+'</button><button class="btn ghost" id="bS">'+(speed>1?'1x':'2x')+'</button><button class="btn ghost" id="bX">Sair</button></div>');
 $('#bP').addEventListener('click',()=>{paused=!paused;$('#bP').textContent=paused?'Continuar':'Pausar'});
 $('#bS').addEventListener('click',()=>{speed=speed>1?1:2.5;$('#bS').textContent=speed>1?'1x':'2x'});
 $('#bX').addEventListener('click',()=>{abort=true})}

let running=false;
let activeLink=null;
function markHop(hop){
 if(activeLink)activeLink.classList.remove('current-link');
 activeLink=hop?.link.el;
 if(activeLink)activeLink.classList.add('current-link');
 const label=device=>device.label || device.host || device.name;
 $('#hopReadout').textContent=hop ? label(hop.from)+' → '+label(hop.to) : '';
}
async function trace(dst){if(running)return;running=true;abort=false;paused=false;prevH=null;sel(null);
 const segs=segments(me,dst);const total=segs.reduce((a,s)=>a+s.hops.length,0)+1;
 const dName=dst===byId.srv?'Servidor':dst.kind==='router'?dst.name:(dst.host||dst.name);
 let ttl=64,step=0,arps=0,routers=0;const vlans=new Set();
 pkInit();following=true;
 const st=P(me.x+.45,me.y+.45,.15);pkAt(st);fly(camFor(st[0],st[1],fitS()*.42),700);await sleep(700);
 try{
 for(let si=0;si<segs.length;si++){const seg=segs[si];
  markHop(null);
  if(seg.from.kind==='router'){ttl--;routers++}
  if(seg.v!=='wan')vlans.add(seg.v);
  const key=seg.from.id+'>'+seg.to.id;const tIP=ipOf(seg.to,seg.v==='wan'?'wan':seg.v),sIP=ipOf(seg.from,seg.v==='wan'?'wan':seg.v);
  if(!ARP[key]){arps++;const dm=domain(seg),col=seg.v==='wan'?'#4c9eeb':VL[seg.v].c;
   traceUI(step,total,'ARP · broadcast','Quem tem '+tIP+'?',(seg.from===me?'Seu PC':seg.from.name)+' ainda não sabe o MAC do próximo salto. Pergunta para todo mundo da '+(seg.v==='wan'?'WAN':'VLAN '+seg.v)+'.',
    {sm:macOf(seg.from),dm:'FF:FF:FF:FF:FF:FF',tag:seg.hops[0].link.type==='trunk'?'VLAN '+seg.v:'sem tag',ttl:'—',si:sIP,di:tIP});
   glow(dm.links,col,1600);dm.nodes.filter(n=>n!==seg.from).forEach(n=>ringAt(n,col));buzz(15);await wait(1900);
   traceUI(step,total,'ARP · resposta',tIP+' respondeu','"Sou eu, meu MAC é '+macOf(seg.to)+'." A resposta fica em cache: da próxima vez, esse passo não acontece.',
    {sm:macOf(seg.to),dm:macOf(seg.from),tag:seg.hops[seg.hops.length-1].link.type==='trunk'?'VLAN '+seg.v:'sem tag',ttl:'—',si:tIP,di:sIP});
   ringAt(seg.to,'#5fd39a');ringAt(seg.from,'#5fd39a');await wait(1700);ARP[key]=1}
  for(let hi=0;hi<seg.hops.length;hi++){const hop=seg.hops[hi],n=hop.from;step++;
   const prevLink=hi>0?seg.hops[hi-1].link:(si>0?segs[si-1].hops[segs[si-1].hops.length-1].link:null);
   const tag=hop.link.type==='trunk'?'VLAN '+seg.v:hop.link.type==='wan'?'— (WAN)':'sem tag';
   const h={sm:macOf(seg.from),dm:macOf(seg.to),tag,ttl,si:me.ip,di:dst.kind==='router'?dst.ifs.wan:dst.ip};
   let tagL,title,txt;
   if(n===me){tagL='Origem';title='Seu PC monta o quadro';
    txt=seg.to===dst?'O destino está na sua sub-rede ('+VL[me.vlan].net+'). Entrega direta: nem passa pelo roteador.':'O destino '+h.di+' está fora da sua sub-rede. O quadro vai para o gateway '+VL[me.vlan].gw+', mas o IP de destino não muda.'}
   else if(n.kind==='switch'){tagL='Camada 2 · '+n.label;title=n.name;
    txt=hop.link.type==='trunk'?'Consulta a tabela MAC e envia pelo trunk 802.1Q. O quadro ganha a tag VLAN '+seg.v+' para o próximo equipamento saber de qual setor ele é.':
     (prevLink&&prevLink.type==='trunk'?'Tira a tag 802.1Q e entrega pela porta de acesso da VLAN '+seg.v+'.':'Consulta a tabela MAC e encaminha pela porta da VLAN '+seg.v+'.')}
   else if(n.kind==='router'){tagL='Camada 3 · '+n.label;title=n.name;
    if(hop.link.type==='wan')txt='Rota estática: '+(dst.vlan?VL[dst.vlan].net:'a outra unidade')+' via '+ipOf(seg.to,'wan')+'. Reescreve os MACs e o TTL cai para '+ttl+'. Na implantação real, isso vai num túnel VPN IPsec.';
    else txt=(seg.v?VL[seg.v].net:'')+' está diretamente conectada (subinterface '+n.ifs[seg.v]+'). Reescreve os MACs, o TTL cai para '+ttl+(prevLink&&prevLink===hop.link?'. Router-on-a-stick: o quadro volta pelo mesmo trunk, agora com a tag VLAN '+seg.v+'.':'.')}
   markHop(hop);
   traceUI(step,total,tagL,title,txt,h);
   await wait(n===me?1500:1700);await move(hop)}}
 buzz([30,60,30,60,80]);
 const pe=P(dst.x+dst.w/2,dst.y+dst.d/2,0);ringAt(dst,'#5fd39a');setTimeout(()=>ringAt(dst,'#5fd39a'),300);
 const devs=new Set();segs.forEach(s=>s.hops.forEach(h=>devs.add(h.to)));
 done(dst,dName,{saltos:devs.size,routers,ttl,arps,vlans:vlans.size})}
 catch(e){gPk.innerHTML='';home()}
 markHop(null);following=false;running=false}
function done(dst,dName,s){mode='done';
 setSheet('<span class="tag delivered">Entregue</span><div class="sh-t">Chegou em '+dName+'</div>'+
 '<div class="stats"><div><b>'+s.saltos+'</b><span>equipamentos no caminho</span></div><div><b>'+s.routers+'</b><span>roteadores</span></div><div><b class="mono">64→'+s.ttl+'</b><span>TTL</span></div><div><b>'+s.arps+'</b><span>consultas ARP</span></div></div>'+
 (s.arps?'<div class="note">Na primeira vez, cada salto precisou de ARP. É por isso que, no Packet Tracer, o primeiro ping da filial ao servidor expirou (3/4). Mande de novo: agora vai direto.</div>':'<div class="note">ARP já estava em cache: o pacote foi direto, sem perguntar nada a ninguém.</div>')+
 '<div class="ctl col"><button class="btn" id="bAg">Mandar de novo</button><button class="btn ghost" id="bOt">Outro destino</button></div>');
 $('#bAg').addEventListener('click',()=>trace(dst));$('#bOt').addEventListener('click',()=>{gPk.innerHTML='';home();fitAll(800)})}
// O menu abre a topologia pronta. A simulação de DHCP continua acessível no cartão do seu PC.
if (!new URLSearchParams(location.search).has('conexao')) {
  me = restore() || pickMe();
  store();
  enterMap();
}
})();
</script>
